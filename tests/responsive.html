<!doctype html><html lang="id"><meta charset="utf-8"><title>ADMIRA · Pemeriksaan responsif</title><style>body{font:14px Arial;background:#e8e9e2;margin:20px;color:#123e3a}header{display:flex;align-items:center;gap:20px;flex-wrap:wrap}button,select{padding:10px;border:1px solid #acb7a3;border-radius:5px;background:white;color:#123e3a}#wrap{margin:20px 0;transform-origin:top left;width:max-content}iframe{border:1px solid #b5c2ad;background:#f7f5ef;height:1050px}#report{padding:14px;background:#fff;max-width:750px;line-height:1.8}.ok{color:#225d45}.bad{color:#8c3c28}</style><header><h2>ADMIRA · Pemeriksaan layar</h2><label>Lebar <select id="width"><option>360</option><option>390</option><option>768</option><option selected>1366</option><option>1440</option></select></label><label>Halaman <select id="page"><option value="overview">Ringkasan</option><option value="followup">Antrean</option><option value="programs">Program</option><option value="analysis">Analisis</option><option value="data">Data</option><option value="modules">Modul</option><option value="account">Akun</option></select></label><button id="check">Periksa tata letak</button></header><div id="report" role="status"></div><div id="wrap"><iframe title="Pratinjau responsif ADMIRA" id="frame" src="/#overview" width="1366"></iframe></div><script>const frame=document.querySelector('#frame'),wrap=document.querySelector('#wrap'),report=document.querySelector('#report');function check(){const doc=frame.contentDocument,w=Number(document.querySelector('#width').value);frame.width=w;wrap.style.transform='scale('+Math.min(1,(innerWidth-45)/w)+')';setTimeout(()=>{const overflow=doc.documentElement.scrollWidth>w;const h=doc.querySelector('h1');report.innerHTML='<strong>'+w+' px · '+(h?h.textContent:'Halaman belum siap')+'</strong><br><span class="'+(overflow?'bad':'ok')+'">'+(overflow?'GAGAL: terdapat gulir horizontal':'LULUS: tidak ada gulir horizontal')+'</span><br>Lebar isi: '+doc.documentElement.scrollWidth+' px; viewport: '+w+' px. Navigasi ponsel: '+(getComputedStyle(doc.querySelector('.bottom-nav')).display!=='none'?'aktif':'tidak aktif')+'.';},150);}document.querySelector('#width').onchange=check;document.querySelector('#check').onclick=check;document.querySelector('#page').onchange=e=>{frame.src='/#'+e.target.value;};frame.onload=check;</script></html>
